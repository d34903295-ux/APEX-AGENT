name: apex-pro-ci

on:
  push:
    paths: ["apex-pro/**", ".github/workflows/apex-pro-ci.yml"]
  pull_request:
    paths: ["apex-pro/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + test deps)
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv rich pytest pytest-asyncio numpy scikit-learn
      - name: Run tests
        # `python -m` + the rootdir conftest.py both put apex-pro on sys.path,
        # so `import apex` resolves from source (no editable install needed).
        run: python -m pytest -q
      - name: Smoke-test orchestrator (paper, 8s)
        run: |
          timeout 8 python -m apex.main || true
